<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover: content extends under the status bar notch/cutout.
      This is required for the app to fill the full screen when installed as a PWA.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Beyond the Bus Stop</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/btbsSVG.svg" />

    <!-- Android / Chrome PWA -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA — forces fullscreen when launched from home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ByndBus" />
    <link rel="apple-touch-icon" href="/btbsPNG.png" />

    <!-- Theme colour for Android Chrome address bar (hidden when installed) -->
    <meta name="theme-color" content="#1A1A1A" />

    <!-- Preconnect to API -->
    <link rel="preconnect" href="https://btbs-backend.onrender.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
